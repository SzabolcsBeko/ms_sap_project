spring.application.name=inventory-service
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${INVENTORY_DB_URL:jdbc:postgresql://localhost:5435/inventory_service}
spring.datasource.username=${INVENTORY_DB_USERNAME:postgres}
spring.datasource.password=${INVENTORY_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none
server.port=8082
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
