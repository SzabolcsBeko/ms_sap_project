spring.application.name=user-service
server.port=8083

# Database (PostgreSQL 16, host port 5433)
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.url=${USER_DB_URL:jdbc:postgresql://localhost:5433/user_service}
spring.datasource.username=${USER_DB_USERNAME:postgres}
spring.datasource.password=${USER_DB_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=none

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

# Keycloak
keycloak.base-url=${KEYCLOAK_BASE_URL:http://localhost:8181}
keycloak.realm=${KEYCLOAK_REALM:spring-microservices-security-realm}

# client_credentials registration for the Keycloak Admin API
spring.security.oauth2.client.registration.keycloak-admin.provider=keycloak
spring.security.oauth2.client.registration.keycloak-admin.client-id=${KEYCLOAK_USER_SERVICE_CLIENT_ID:user-service}
spring.security.oauth2.client.registration.keycloak-admin.client-secret=${KEYCLOAK_USER_SERVICE_SECRET:change-me-dev-secret}
spring.security.oauth2.client.registration.keycloak-admin.authorization-grant-type=client_credentials
spring.security.oauth2.client.provider.keycloak.token-uri=${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/token

# Resource server for GET /api/user/me (jwk-set-uri keeps startup independent of Keycloak being up)
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${keycloak.base-url}/realms/${keycloak.realm}/protocol/openid-connect/certs
spring.security.oauth2.resourceserver.jwt.issuer-uri=${keycloak.base-url}/realms/${keycloak.realm}

# Actuator
management.endpoints.web.exposure.include=health,info,circuitbreakers
management.health.circuitbreakers.enabled=true

# Resilience4j — "keycloak" instance (mirrors order-service's "inventory" settings).
# Business errors (duplicate user, weak password) are ignored so they never trip the breaker.
resilience4j.circuitbreaker.instances.keycloak.registerHealthIndicator=true
resilience4j.circuitbreaker.instances.keycloak.slidingWindowType=COUNT_BASED
resilience4j.circuitbreaker.instances.keycloak.slidingWindowSize=5
resilience4j.circuitbreaker.instances.keycloak.failureRateThreshold=50
resilience4j.circuitbreaker.instances.keycloak.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.keycloak.permittedNumberOfCallsInHalfOpenState=3
resilience4j.circuitbreaker.instances.keycloak.minimum-number-of-calls=5
resilience4j.circuitbreaker.instances.keycloak.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.keycloak.ignore-exceptions=com.techie.microservices.user.exception.UserAlreadyExistsException,com.techie.microservices.user.exception.WeakPasswordException
